name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    name: Protocol, plugin and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release selection and upstream sync regressions
        run: node --test packages/dsh-remora/scripts/compat/*.test.mjs hub/scripts/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: hub/ has the current protocol copy
        run: pnpm vendor:check
      - run: pnpm pack:plugin
      - name: Plugin src and dist do not define a language
        working-directory: packages/dsh-remora
        run: rc=0; grep -rnF addLanguage src dist || rc=$?; test "$rc" -eq 1
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-remora-plugin
          path: artifacts/
          if-no-files-found: error

  compat:
    name: Adapter compat (latest supported DSH)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Latest public DSH tag within the plugin peer range
        id: dsh
        run: node packages/dsh-remora/scripts/compat/latest-supported.mjs
      - name: Run the adapter against that commit
        env:
          DSH_UPSTREAM_COMMIT: ${{ steps.dsh.outputs.commit }}
        run: pnpm --filter dsh-remora test:compat

  hub:
    name: Hub (Cloudflare Worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist
