name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    name: Protocol, plugin and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: hub/ has the current protocol copy
        run: pnpm vendor:check
      - run: pnpm pack:plugin
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-remora-plugin
          path: artifacts/
          if-no-files-found: error

  hub:
    name: Hub (Cloudflare Worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist
