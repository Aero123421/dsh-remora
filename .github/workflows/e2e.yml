# E2E: real DSH from npm + the Remora plugin tarball (+ the hub under
# wrangler dev for the flow). See docs/e2e.md.
#   - pull requests touching the plugin, protocol, hub or harness
#   - nightly and releases: minimum + latest published DSH within the peer range
#   - called by the release workflow before publishing
name: E2E
on:
  pull_request:
    paths:
      - 'packages/dsh-remora/**'
      - 'packages/protocol/**'
      - 'hub/**'
      - 'e2e/**'
      - 'upstream.json'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/release.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'all, browser or flow'
        default: all
        type: choice
        options: [all, browser, flow]
      dsh-version:
        description: 'Exact supported DSH version (empty = minimum + latest supported)'
        default: ''
        type: string
      strict:
        description: 'Fail when a step is skipped'
        default: false
        type: boolean
  workflow_call:
    inputs:
      only:
        default: all
        type: string
      dsh-version:
        default: ''
        type: string
      strict:
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Select supported DSH releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.dsh.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter dsh-remora
      - name: Resolve supported published releases
        id: dsh
        env:
          REMORA_CI_DSH_VERSION: ${{ inputs.dsh-version || '' }}
          MINIMUM_ONLY: ${{ github.event_name == 'pull_request' && '--minimum-only' || '' }}
        run: node packages/dsh-remora/scripts/compat/latest-supported.mjs --matrix $MINIMUM_ONLY

  e2e:
    name: E2E (DSH ${{ matrix.dsh }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PRs run the minimum once; releases/nightly gate both supported endpoints.
        dsh: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harness dependencies (Playwright pinned in e2e/package-lock.json)
        run: |
          npm --prefix e2e ci --no-audit --no-fund
          npm --prefix e2e exec -- playwright install --with-deps chromium
      - name: Run
        env:
          ONLY: ${{ inputs.only || 'all' }}
          DSH_VERSION: ${{ matrix.dsh }}
          STRICT: ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.strict) && '--strict' || '' }}
        run: |
          args="--only=${ONLY}"
          [ "$ONLY" = "all" ] && args=""
          [ -n "$DSH_VERSION" ] && args="$args --dsh-version=$DSH_VERSION"
          node e2e/run.mjs $args $STRICT
      - name: Summary
        if: always()
        run: test -f artifacts/e2e/summary.md && cat artifacts/e2e/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.dsh }}-${{ github.run_attempt }}
          path: artifacts/e2e/
          retention-days: 14
