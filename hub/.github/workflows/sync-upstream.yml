# Active only in a copy made by the Deploy to Cloudflare button, where this
# folder becomes the repository root. Inside Aero123421/dsh-remora it is inert.
name: Sync Remora hub from upstream
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: remora-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository != 'Aero123421/dsh-remora'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTREAM: Aero123421/dsh-remora
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Update the sync branch and ensure its pull request exists
        run: node scripts/sync-upstream.mjs
